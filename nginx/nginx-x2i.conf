# Nginx compatibility proxy for x2i -> Telegraf.
# Chain: x2i => nginx:8088 => telegraf:8087 => InfluxDB 2.x

worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-x2i.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    default_type application/json;

    upstream telegraf_x2i {
        server 127.0.0.1:8087;
        keepalive 5000;
    }

    server {
        listen 8088;
        server_name localhost;

        location /ping {
            add_header X-Influxdb-Build OSS;
            add_header X-Influxdb-Version 1.8.10;
            return 204;
        }

        location /write {
            proxy_pass http://telegraf_x2i;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location /query {
            add_header X-Influxdb-Build OSS;
            add_header X-Influxdb-Version 1.8.10;
            return 200 '{"results":[{"statement_id":0}]}';
        }
    }
}
