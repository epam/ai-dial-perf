worker_processes 1;
error_log /dev/stderr;
pid /tmp/nginx-x2i.pid;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;

    upstream telegraf {
        server localhost:8087;
        keepalive 5000;
    }

    server {
        listen 8088;

        # Health check endpoint for nginx startup readiness probe.
        # Returns InfluxDB-compatible 204 immediately, without requiring
        # the Telegraf upstream to be ready.
        location /ping {
            add_header 'X-Influxdb-Build' 'OSS';
            add_header 'X-Influxdb-Version' '2.0.0';
            return 204;
        }

        # All write and query requests are proxied to Telegraf's influxdb_listener
        # (v1 protocol: /write, /query). proxy_http_version 1.1 + clearing the
        # Connection header activate keepalive reuse with the upstream block above.
        location / {
            proxy_pass http://telegraf;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
